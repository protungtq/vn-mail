name: Packages

# Builds the .deb and .rpm once, then installs each in clean containers and
# runs `vnmail --version`.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENWREN_NO_STATS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config rpm

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles deb,rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            kind: deb
          - image: ubuntu:24.04
            kind: deb
          - image: debian:12
            kind: deb
          - image: fedora:latest
            kind: rpm
    container:
      image: ${{ matrix.image }}
    env:
      OPENWREN_NO_STATS: "1"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages

      - name: Install the .deb
        if: matrix.kind == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./packages/deb/*.deb

      - name: Install the .rpm
        if: matrix.kind == 'rpm'
        run: dnf install -y ./packages/rpm/*.rpm

      - name: Run vnmail --version
        run: |
          out=$(vnmail --version)
          echo "$out"
          echo "$out" | grep -Eq '^vnmail [0-9]+\.[0-9]+\.[0-9]+'
