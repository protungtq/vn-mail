name: Release

# A tag such as v0.2.0 builds VN Mail for Linux, Windows and macOS and
# publishes a GitHub Release with the packages. The publish job also signs
# the updatable packages with the update key and writes latest.json, so the
# app itself can offer the new version (Cài đặt → Giới thiệu → Kiểm tra ngay)
# and install it after checking the signature. The private key lives only in
# the TAURI_SIGNING_PRIVATE_KEY secret; the build jobs never see it.

on:
  push:
    tags:
      - "v*"

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# Two releases must not publish at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Builds the packages. This job runs all third-party build code (npm packages,
  # Rust crates, build scripts), so it gets no secrets and a read-only token.
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      OPENWREN_NO_STATS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config rpm

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # --locked: build exactly the Rust crates recorded in Cargo.lock.
      - run: pnpm tauri build --bundles deb,rpm,appimage -- --locked

      - name: Collect packages and write SHA256SUMS
        run: |
          mkdir release
          cp src-tauri/target/release/bundle/deb/*.deb \
             src-tauri/target/release/bundle/rpm/*.rpm \
             src-tauri/target/release/bundle/appimage/*.AppImage \
             release/
          cd release
          sha256sum -- *.deb *.rpm *.AppImage > SHA256SUMS.linux
          cat SHA256SUMS.linux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux
          path: release/
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    permissions:
      contents: read
    # The build must run in PowerShell: under Bash, "perl" is Git's cut-down Perl,
    # which cannot configure the OpenSSL that the encrypted database builds.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The encrypted database builds its own OpenSSL, which wants an assembler.
      - name: Install NASM
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles nsis -- --locked

      - name: Collect the installer
        shell: bash
        run: |
          mkdir release
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release/
          cd release
          sha256sum -- *.exe > SHA256SUMS.windows
          cat SHA256SUMS.windows

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows
          path: release/
          if-no-files-found: error
          retention-days: 3

  # One build for all Macs: Apple silicon and Intel in the same app.
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable for both processors
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg -- --locked

      # The .dmg is what people download; the .app.tar.gz is the same app as an archive.
      - name: Collect the disk image and the app archive
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir release
          cp "$bundle"/dmg/*.dmg release/
          tar -czf "release/VN-Mail_${version}_universal.app.tar.gz" -C "$bundle/macos" "VN Mail.app"
          cd release
          shasum -a 256 -- *.dmg *.app.tar.gz > SHA256SUMS.macos
          cat SHA256SUMS.macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-macos
          path: release/
          if-no-files-found: error
          retention-days: 3

  # Publishes what the build jobs produced as a GitHub Release, signs the
  # packages the in-app updater installs, and writes latest.json for it.
  # This is the only job that touches the update key: the build jobs run
  # third-party build code and get no secrets.
  publish:
    needs: [verify, build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release/

      - name: Check the packages against their checksums
        run: |
          cd release
          for sums in SHA256SUMS.linux SHA256SUMS.windows SHA256SUMS.macos; do
            sha256sum --check --strict "$sums"
          done
          cat SHA256SUMS.linux SHA256SUMS.windows SHA256SUMS.macos > SHA256SUMS
          rm SHA256SUMS.linux SHA256SUMS.windows SHA256SUMS.macos
          cat SHA256SUMS

      # The Tauri CLI signs with the update key from the environment.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # Signs the Windows installer, the macOS app archive and the AppImage,
      # then writes latest.json (the file the app checks) with their
      # signatures and download links. The .dmg and the system packages are
      # for manual download, so they are not signed and not listed.
      - name: Sign the updatable packages and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in release/*.exe release/*.app.tar.gz release/*.AppImage; do
            [ -e "$file" ] || continue
            pnpm tauri signer sign "$file"
          done
          ls -l release/*.sig
          node scripts/update-manifest.mjs "$GITHUB_REF_NAME"

      - name: Install the public-key verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Verify signatures from the updater manifest
        run: node scripts/verify-update-signatures.mjs

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Safe to run again: a rerun after a failed upload finds the release already there.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              release/*.deb release/*.rpm release/*.AppImage release/*.exe release/*.dmg release/*.app.tar.gz release/SHA256SUMS release/latest.json release/*.sig
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "VN Mail ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              release/*.deb release/*.rpm release/*.AppImage release/*.exe release/*.dmg release/*.app.tar.gz release/SHA256SUMS release/latest.json release/*.sig
          fi
